name: kklaw-os

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/web/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
      - app

  api:
    image: ghcr.io/REPLACE_ORG/kklaw-api:${APP_IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file:
      - ./.env.production
    expose:
      - "3000"
    volumes:
      - /srv/kklaw/data/documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app

  worker:
    image: ghcr.io/REPLACE_ORG/kklaw-worker:${APP_IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file:
      - ./.env.production
    volumes:
      - /srv/kklaw/data/documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    env_file:
      - ./.env.production
    volumes:
      - /srv/kklaw/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kklaw} -d ${POSTGRES_DB:-kklaw}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

  redis:
    image: redis:8.2.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - /srv/kklaw/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - app

networks:
  edge:
  app:
    internal: true

volumes:
  caddy_data:
  caddy_config:
