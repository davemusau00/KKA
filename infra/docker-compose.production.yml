name: kka-lawfirm-os

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${KKA_DATA_ROOT:-/srv/kklaw/data}/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.2-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "900", "1", "--save", "300", "10"]
    volumes:
      - ${KKA_DATA_ROOT:-/srv/kklaw/data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 3000
      SESSION_COOKIE_SECURE: "true"
      WEB_ORIGIN: https://${WEB_DOMAIN:-os.kariukikagunda.com}
      API_PUBLIC_URL: https://${API_DOMAIN:-api.kariukikagunda.com}
      CSRF_ENABLED: "true"
      PUBLIC_BRANDING_FIRM_ID: ${PUBLIC_BRANDING_FIRM_ID}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ${KKA_DATA_ROOT:-/srv/kklaw/data}/documents:/srv/kklaw/data/documents
      - ${KKA_DATA_ROOT:-/srv/kklaw/data}/marks:/srv/kklaw/data/marks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BRANDING_FIRM_ID: ${PUBLIC_BRANDING_FIRM_ID}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ${KKA_DATA_ROOT:-/srv/kklaw/data}/documents:/srv/kklaw/data/documents
      - ${KKA_DATA_ROOT:-/srv/kklaw/data}/marks:/srv/kklaw/data/marks
    networks: [backend]
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-os.kariukikagunda.com}
      API_DOMAIN: ${API_DOMAIN:-api.kariukikagunda.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WEB_DIST_PATH:-../apps/web/dist}:/srv/web:ro
      - ${KKA_DATA_ROOT:-/srv/kklaw/data}/caddy/data:/data
      - ${KKA_DATA_ROOT:-/srv/kklaw/data}/caddy/config:/config
    networks: [backend]
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge
